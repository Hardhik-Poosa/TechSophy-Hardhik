name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

# Avoid piling up duplicate runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Use a stable version that matches what you actually run in Docker
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # dev tools
          pip install pytest pytest-cov ruff bandit pre-commit

      # Optional but nice: ensure pre-commit hooks pass in CI too
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Run ruff (lint)
        run: |
          ruff check .

      - name: Run tests with coverage
        run: |
          pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Run bandit (security scan)
        run: |
          bandit -c bandit.yaml -r src

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
